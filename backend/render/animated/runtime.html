function fmt(n, prefix = '', suffix = '') {

        setPop(s.dest, destX(i), 640, pop(t, cs[i]));
      });
    };
  },

  compare(g, p, T) {
    const sides = [p.left || {}, p.right || {}]; const win = p.winner === 'left' ? 0 : p.winner === 'right' ? 1 : -1;
    const xs = [1000, 1540], w = 480, y0 = 220, h = 580;
    const cards = sides.map((s, i) => {
      const gc = mk('g', {}, g);
      const box = mk('rect', { x: -w / 2, y: 0, width: w, height: h, rx: 30, fill: '#fff', stroke: 'transparent', 'stroke-width': 8, filter: 'url(#sh)' }, gc);
      const head = mk('rect', { x: -w / 2, y: 0, width: w, height: 96, rx: 30, fill: i === 0 ? C.ink : C.green }, gc);
      mk('rect', { x: -w / 2, y: 60, width: w, height: 36, fill: i === 0 ? C.ink : C.green }, gc);
      txt(gc, 0, 66, s.title || (i ? 'Option B' : 'Option A'), { font: 'Anton', size: 50, fill: '#fff', maxW: w - 40, upper: true });
      let y = 150;
      if (s.value !== undefined && s.value !== null && s.value !== '') { txt(gc, 0, y + 52, typeof s.value === 'number' ? fmt(s.value, p.prefix || '', p.suffix || '') : String(s.value), { font: 'Anton', size: 84, fill: i === win ? C.green : C.ink, maxW: w - 40 }); y += 110; }
      const pts = (s.points || []).slice(0, 3).map((raw, k) => {
        const pt = typeof raw === 'object' && raw ? String(raw.text || '') : String(raw);
        const good = typeof raw === 'object' && raw && typeof raw.good === 'boolean' ? raw.good : (win === -1 ? null : i === win ? true : null);
        const row = mk('g', { transform: `translate(${-w / 2 + 40},${y + 20 + k * 100})` }, gc);
        mk('circle', { cx: 20, cy: 0, r: 20, fill: good === null ? C.gray : good ? C.green : C.coral }, row);
        mk('path', { d: good === false ? 'M 12 -8 L 28 8 M 28 -8 L 12 8' : good === null ? 'M 13 0 H 27' : 'M 11 0 L 18 8 L 30 -7', stroke: '#fff', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }, row);
        const tb = textBlock(row, 56, 0, pt, { size: 30, weight: 800, maxLines: 2, maxW: w - 120, anchor: 'start' });
        return row;
      });
      return { gc, box, pts };
    });
    const vs = mk('g', {}, g); mk('circle', { r: 52, fill: C.gold }, vs); txt(vs, 0, 18, 'VS', { font: 'Anton', size: 52, fill: C.ink });
    const tR = cueFor(sides[1].title, T * 0.4);
    const appear = [0.2, clamp(tR - 0.2, 0.6, Math.max(0.6, T * 0.5))];
    const winAt = Math.max(appear[1] + 1, T * 0.75);
    return t => {
      cards.forEach((c, i) => {
        const s = pop(t, appear[i], 0.5);
        const wb = i === win && t > winAt ? 1 + 0.05 * Math.sin(seg(t, winAt, winAt + 0.4) * Math.PI) : 1;
        c.gc.setAttribute('transform', `translate(${xs[i]},${y0 + (1 - Math.min(1, s)) * 60}) scale(${wb})`); c.gc.setAttribute('opacity', clamp(s));
        c.box.setAttribute('stroke', i === win && t > winAt ? C.gold : 'transparent');
        c.pts.forEach((r, k) => r.setAttribute('opacity', seg(t, appear[i] + 0.4 + k * 0.35, appear[i] + 0.6 + k * 0.35)));
      });
      setPop(vs, 1270, 500, pop(t, appear[1] - 0.1));
    };
  },

  checklist(g, p, T) {
    const items = (p.items || []).slice(0, 5); const n = items.length;
    const top = 200, rowH = n > 4 ? 104 : 118, h = 130 + n * rowH;
    const card = mk('rect', { x: 760, y: top, width: 1040, height: h, rx: 30, fill: '#fff', filter: 'url(#sh)' }, g);
    const title = txt(g, 1280, top + 82, p.title || '', { font: 'Anton', size: 58, maxW: 960, upper: true });
    const rows = items.map((it, i) => {
      const y = top + 150 + i * rowH;
      const gr = mk('g', { transform: `translate(820,${y})` }, g);
      mk('rect', { x: 0, y: -30, width: 60, height: 60, rx: 14, fill: '#F1E4D3' }, gr);
      const ck = mk('path', { d: 'M 14 2 L 26 16 L 48 -12', stroke: '#fff', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, gr);
      const fillBox = mk('rect', { x: 0, y: -30, width: 60, height: 60, rx: 14, fill: C.green, opacity: 0 }, gr);
      gr.insertBefore(fillBox, ck);
      textBlock(gr, 90, 0, it, { size: 40, weight: 800, maxLines: 2, maxW: 860, anchor: 'start', min: 26 });
      return { gr, ck, fillBox };
    });
    const cs = cues(items, T, 0.6, 0.82);
    return t => {
      const s = easeOut(seg(t, 0.05, 0.4));
      card.setAttribute('opacity', s); title.setAttribute('opacity', s);
      rows.forEach((r, i) => {
        r.gr.setAttribute('opacity', seg(t, cs[i] - 0.35, cs[i] - 0.1));
        const k = seg(t, cs[i], cs[i] + 0.3);
        r.fillBox.setAttribute('opacity', k);
        r.ck.setAttribute('stroke-dasharray', `${60 * easeOut(k)} 60`);
      });
    };
  },

  timeline(g, p, T) {
    const pts = (p.points || []).slice(0, 5); const n = Math.max(2, pts.length);
    const x0 = 820, x1 = 1740, y = 560;
    const title = p.title ? txt(g, CX, 250, p.title, { size: 46, weight: 900, maxW: 1080 }) : null;
    mk('line', { x1: x0, y1: y, x2: x1, y2: y, stroke: '#EADBC6', 'stroke-width': 16, 'stroke-linecap': 'round' }, g);
    const prog = mk('line', { x1: x0, y1: y, x2: x0, y2: y, stroke: C.green, 'stroke-width': 16, 'stroke-linecap': 'round' }, g);
    const nodes = pts.map((pt, i) => {
      const x = x0 + (x1 - x0) * i / (n - 1);
      const gn = mk('g', {}, g);
      mk('circle', { r: 30, fill: '#fff', stroke: C.green, 'stroke-width': 10 }, gn);
      const v = pt.value !== undefined && pt.value !== null && pt.value !== '' ? txt(gn, 0, -64, typeof pt.value === 'number' ? fmt(pt.value, p.prefix || '', p.suffix || '') : String(pt.value), { font: 'Anton', size: n > 4 ? 48 : 58, fill: i === pts.length - 1 ? '#B45309' : C.ink, maxW: (x1 - x0) / (n - 1) + 20 }) : null;
      textBlock(gn, 0, 88, pt.label || '', { size: 30, weight: 900, fill: C.gray, maxLines: 2, maxW: Math.min(260, (x1 - x0) / (n - 1) + 30), top: true });
      return { gn, x };
    });
    const cs = cues(pts.map(pt => pt.label), T, 0.5, 0.78);
    return t => {
      if (title) title.setAttribute('opacity', seg(t, 0.05, 0.35));
      let px = x0;
      nodes.forEach((nd, i) => { const s = pop(t, cs[i]); setPop(nd.gn, nd.x, y, s); if (t >= cs[i]) px = nd.x; });
      const prev = prog.getAttribute('x2') * 1; prog.setAttribute('x2', px);
    };
  },

  icons(g, p, T) {
    const items = (p.items || []).slice(0, 4); const n = items.length || 1;
    const title = p.title ? txt(g, CX, 250, p.title, { font: 'Anton', size: 64, maxW: 1080, upper: true }) : null;
    const slot = 1080 / n;
    const nodes = items.map((it, i) => {
      const gi = mk('g', {}, g); badge(gi, it.icon || 'coin', n > 3 ? 90 : 105);
      textBlock(gi, 0, n > 3 ? 130 : 150, it.label || '', { size: 36, weight: 900, maxLines: 2, maxW: slot - 30, top: true });
      return { gi, x: CX - 540 + slot * (i + 0.5) };
    });
    const cs = cues(items.map(i => i.label), T, 0.4, 0.75);
    return t => {
      if (title) title.setAttribute('opacity', seg(t, 0.05, 0.35));
      nodes.forEach((nd, i) => setPop(nd.gi, nd.x, 500 + Math.sin(t * 2 + i) * 6, pop(t, cs[i])));
    };
  },

  outro(g, p, T) {
    const btn = mk('g', {}, g);
    const bg = mk('rect', { x: -260, y: -64, width: 520, height: 128, rx: 26, fill: '#EF4444' }, btn);
    const label = txt(btn, 0, 26, 'SUBSCRIBE', { font: 'Anton', size: 74, fill: '#fff' });
    const bell = mk('g', {}, g); mk('path', { d: 'M -34 20 C -34 -30 -22 -44 0 -46 C 22 -44 34 -30 34 20 L 44 32 H -44 Z', fill: C.gold }, bell); mk('circle', { cx: 0, cy: 42, r: 10, fill: C.gold }, bell);
    const cursor = mk('path', { d: 'M 0 0 L 0 56 L 14 42 L 24 66 L 34 62 L 24 38 L 44 38 Z', fill: '#fff', stroke: C.ink, 'stroke-width': 5, 'stroke-linejoin': 'round' }, g);
    const tb = textBlock(g, CX, 720, p.text || 'More money tips every week', { size: 46, weight: 900, maxLines: 2, maxW: 1000 });
    const click = Math.min(1.6, T * 0.4);
    return t => {
      const pressed = t > click;
      bg.setAttribute('fill', pressed ? '#9CA3AF' : '#EF4444');
      label.textContent = pressed ? 'SUBSCRIBED' : 'SUBSCRIBE';
      const press = t > click && t < click + 0.15 ? 0.94 : 1;
      setPop(btn, CX, 450, pop(t, 0.1) * press);
      setPop(bell, CX + 360, 450, pop(t, click + 0.2), `rotate(${t > click + 0.2 ? Math.sin(t * 22) * 16 * (1 - seg(t, click + 0.2, click + 1.4)) : 0})`);
      const cp = easeInOut(seg(t, 0.4, click));
      cursor.setAttribute('transform', `translate(${lerp(1700, CX + 120, cp)},${lerp(800, 470, cp)}) scale(${press})`);
      cursor.setAttribute('opacity', seg(t, 0.3, 0.5) * (1 - seg(t, click + 0.8, click + 1.1)));
      tb.el.setAttribute('opacity', seg(t, click + 0.3, click + 0.7));
    };
  },
};
TEMPLATES.thumbnail = null;   // separate entry point below

// ════════════════════════ runtime ════════════════════════
let update = null, CAPS = [];
function buildLogo(brand) {
  const g = $('logo'); g.innerHTML = '';
  mk('circle', { cx: 26, cy: 26, r: 26, fill: C.gold }, g); txt(g, 26, 37, '$', { size: 30, weight: 900, fill: '#8A5A00' });
  const m = String(brand).match(/^([A-Z]?[a-z]+)(.*)$/);
  const t = mk('text', { x: 66, y: 37, 'font-size': 30, 'font-weight': 900, fill: C.ink }, g);
  t.textContent = m ? m[1] : brand;
  if (m && m[2]) { const s = mk('tspan', { fill: C.green }, t); s.textContent = m[2]; }
}

function setBeat(beat) {
  BEAT = beat;
  const stage = $('stage'); stage.innerHTML = '';
  buildLogo(beat.brand || 'WealthSutra');
  const root = mk('g', { id: 'content' }, stage);
  if (beat.kicker) root._pill = pill(root, CX, 120, String(beat.kicker).toUpperCase().slice(0, 28), beat.kickerColor || C.ink);
  const tpl = TEMPLATES[beat.template] || TEMPLATES.keyword;
  try { update = tpl(mk('g', {}, root), beat.params || {}, beat.T); }
  catch (e) { console.error('template failed', beat.template, e); stage.innerHTML = ''; const r2 = mk('g', { id: 'content' }, stage); update = TEMPLATES.keyword(mk('g', {}, r2), { text: beat.fallbackText || '', icon: 'coin' }, beat.T); }
  CAPS = beat.captions || [];
}

function render(lt) {
  const b = BEAT, gt = b.start + lt, T = b.T;
  $('bg1').setAttribute('cx', 1650 + Math.sin(gt * 0.3) * 30);
  $('bg2').setAttribute('cy', 980 + Math.cos(gt * 0.25) * 20);
  update(lt);
  const content = $('content');
  const inA = easeOut(seg(lt, 0, 0.3)), outA = b.wipeOut ? 1 : 1 - seg(lt, T - 0.2, T);
  content.setAttribute('opacity', Math.min(inA, outA));
  content.setAttribute('transform', `translate(0,${(1 - inA) * 18})`);
  if (content._pill) content._pill.setAttribute('transform', `translate(${CX},120) scale(${pop(lt, 0.05, 0.35)})`);
  character(gt, lt, b.mood || 'neutral', T);
  // circle wipe into/out of headings
  let r = 0;
  if (b.wipeIn && lt < 0.28) r = 1500 * (1 - easeInOut(seg(lt, 0, 0.28)));
  if (b.wipeOut && lt > T - 0.25) r = 1500 * easeInOut(seg(lt, T - 0.25, T));
  $('wipe').setAttribute('r', r);
  // captions (global time)
  const cap = CAPS.find(c => gt >= c.a && gt < c.b);
  const ci = $('capInner');
  if (cap) {
    ci.style.visibility = 'visible';
    ci.innerHTML = cap.html;
    ci.style.transform = `scale(${0.86 + 0.14 * back(seg(gt, cap.a, cap.a + 0.18))})`;
  } else ci.style.visibility = 'hidden';
}

// Thumbnail (1280×720): character + big text + icon
function renderThumbnail(o) {
  document.body.classList.add('thumb');
  const svg = $('s'); svg.setAttribute('viewBox', '0 0 1920 1080'); svg.setAttribute('width', 1280); svg.setAttribute('height', 720);
  buildLogo(o.brand || 'WealthSutra');
  const stage = $('stage'); stage.innerHTML = '';
  const g = mk('g', {}, stage);
  const rays = mk('g', { transform: 'translate(1360,560)' }, g);
  for (let i = 0; i < 16; i++) mk('rect', { x: -14, y: -900, width: 28, height: 520, fill: C.gold, opacity: 0.18, transform: `rotate(${i * 22.5})` }, rays);
  const tb = textBlock(g, 1220, 470, o.text || '', { font: 'Anton', size: 230, min: 110, maxLines: 3, maxW: 1150, upper: true, fill: C.ink, lineH: 1.02 });
  // gold highlight on numbers
  tb.el.querySelectorAll('tspan').forEach(ts => { if (/\d/.test(ts.textContent)) ts.setAttribute('fill', C.green); });
  if (o.icon) { const ic = badge(g, o.icon, 120); ic.setAttribute('transform', `translate(1760,170) rotate(10)`); }
  BEAT = { start: 0, T: 1, words: [] };
  character(1.2, 1, o.mood || 'surprised', 1);
  $('char').setAttribute('transform', 'translate(380,1010) scale(1.32)');
  $('floor').setAttribute('opacity', 0);
  $('cap').style.display = 'none';
}

window.setBeat = setBeat;
window.render = render;
window.renderThumbnail = renderThumbnail;
window.TEMPLATE_NAMES = Object.keys(TEMPLATES).filter(k => TEMPLATES[k]);
window.ICON_NAMES = Object.keys(ICONS);
</script>
